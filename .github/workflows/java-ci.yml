name: Java CI (Head First Java Examples)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile (javac -> out/)  # compile source utama saja (tanpa tests)
        run: |
          mkdir -p out
          find src -name "*.java" -not -path "src/headfirst/tests/*" > sources.txt
          javac -encoding UTF-8 -d out @sources.txt

      - name: Smoke tests (console-only demos)
        run: |
          set -eux
          java -cp out headfirst.ch01.MyFirstApp
          java -cp out headfirst.ch01.DooBee
          java -cp out headfirst.ch01.Loopy
          java -cp out headfirst.ch02.GameLauncher
          java -cp out headfirst.ch03.PrimitiveRefDemo
          java -cp out headfirst.ch03.ArrayIntro
          java -cp out headfirst.ch03.DogTestDrive
          java -cp out headfirst.ch04.DogEncapTest
          java -cp out headfirst.ch04.PassByValue
          java -cp out headfirst.ch06.ArrayListDog
          java -cp out headfirst.ch07.InheritanceDemo
          java -cp out headfirst.ch08.PolymorphismDemo
          java -cp out headfirst.ch09.ConstructorDemo
          java -cp out headfirst.ch10.NumberFormatDemo
          java -cp out headfirst.ch11.ExceptionDemo
          java -cp out headfirst.ch16.CollectionsDemo
          (cd out && jar cfe ../hello.jar headfirst.ch17.HelloJar headfirst/ch17/HelloJar.class)
          java -jar hello.jar

      - name: Compile tests
        run: |
          find src/headfirst/tests -name "*.java" > test_sources.txt
          javac -encoding UTF-8 -cp out -d out @test_sources.txt

      - name: Run full chapter tests (headless where needed)
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          set -eux
          java -cp out headfirst.tests.TestCh01
          java -cp out headfirst.tests.TestCh02
          java -cp out headfirst.tests.TestCh03
          java -cp out headfirst.tests.TestCh04
          java -cp out headfirst.tests.TestCh05_06
          java -cp out headfirst.tests.TestCh07
          java -cp out headfirst.tests.TestCh08
          java -cp out headfirst.tests.TestCh09
          java -cp out headfirst.tests.TestCh10
          java -cp out headfirst.tests.TestCh11
          java -cp out headfirst.tests.TestCh12
          java -cp out headfirst.tests.TestCh13
          java -cp out headfirst.tests.TestCh14
          # Networking (server/client) diberi timeout agar tidak hang
          timeout 10s java -cp out headfirst.tests.TestCh15
          # RMI (Bab 18) sekarang sudah auto-exit, tetap jaga dengan timeout
          timeout 10s java -cp out headfirst.tests.TestCh18
          # Packaging (jar)
          java -cp out headfirst.tests.TestCh17

      - name: Archive compiled classes & jar
        uses: actions/upload-artifact@v4
        with:
          name: java-classes-and-jar
          path: |
            out/**
            hello.jar
